# The checks that need no SAP system. ABAP Unit is not here: the tests use
# abapGit and TADIR, so they only run on a system (see README).
name: check

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: abaplint (expect 0 issues)
        run: npx abaplint abaplint.jsonc
      - name: abap2UI5-linter (property gate + headless render)
        uses: abap2UI5/linter@41e3fbde14281181d81a121f629eb96164deb961 # v0.8.5
