<div id="ag2ui5-tags-preview" class="viz-carousel" aria-label="Repository label designs">
  <section data-variant="Soft pills" aria-label="Soft pills design">
    <div class="ag-preview" data-treatment="pills"></div>
  </section>
  <section data-variant="Quiet dots" aria-label="Quiet dots design" hidden>
    <div class="ag-preview" data-treatment="dots"></div>
  </section>
</div>
<style>
  #ag2ui5-tags-preview .ag-preview {
    --ag-bg: light-dark(#f5f6f7, #101820);
    --ag-surface: light-dark(#ffffff, #1d2832);
    --ag-text: light-dark(#1d2d3e, #edf2f7);
    --ag-muted: light-dark(#556b82, #b5c4d3);
    --ag-line: light-dark(#d9e0e7, #435567);
    --ag-link: light-dark(#0064d9, #91c8ff);
    color-scheme: light dark;
    font: 14px/1.5 Arial, sans-serif;
    color: var(--ag-text);
    background: var(--ag-bg);
    border: 1px solid var(--ag-line);
    border-radius: 12px;
    min-height: 340px;
    overflow: hidden;
  }
  #ag2ui5-tags-preview .ag-preview * { box-sizing: border-box; }
  #ag2ui5-tags-preview .ag-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 18px; background: var(--ag-surface);
    border-bottom: 1px solid var(--ag-line);
  }
  #ag2ui5-tags-preview .ag-title { font-size: 18px; font-weight: 500; margin: 0; }
  #ag2ui5-tags-preview .ag-layout { display: flex; flex-shrink: 0; gap: 0; }
  #ag2ui5-tags-preview .ag-layout button {
    font: inherit; color: var(--ag-link); background: var(--ag-surface);
    border: 1px solid var(--ag-line); padding: 5px 12px;
  }
  #ag2ui5-tags-preview .ag-layout button:first-child { border-radius: 7px 0 0 7px; }
  #ag2ui5-tags-preview .ag-layout button:last-child { border-radius: 0 7px 7px 0; }
  #ag2ui5-tags-preview .ag-layout button[aria-pressed="true"] {
    color: var(--ag-text); background: light-dark(#e5f0ff, #254361);
    border-color: var(--ag-link);
  }
  #ag2ui5-tags-preview .ag-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 18px; }
  #ag2ui5-tags-preview .ag-tile { background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: 12px; min-width: 0; }
  #ag2ui5-tags-preview .ag-tile-header { display: flex; align-items: start; gap: 12px; padding: 18px 16px 10px; }
  #ag2ui5-tags-preview .ag-repo-icon { color: var(--ag-link); padding-top: 4px; }
  #ag2ui5-tags-preview .ag-identity { flex: 1; min-width: 0; }
  #ag2ui5-tags-preview .ag-name { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
  #ag2ui5-tags-preview .ag-package { color: var(--ag-muted); font-size: 13px; overflow-wrap: anywhere; }
  #ag2ui5-tags-preview .ag-star { color: var(--ag-link); padding-top: 4px; }
  #ag2ui5-tags-preview .ag-tile-content { padding: 0 16px 14px; }
  #ag2ui5-tags-preview .ag-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-width: 0; }
  #ag2ui5-tags-preview .ag-tile-content > .ag-tags { margin-bottom: 12px; }
  #ag2ui5-tags-preview .ag-tag {
    --ag-hue: light-dark(#0057a7, #99caff);
    --ag-tint: light-dark(#e9f3ff, #16364f);
    font-size: 12px; border-radius: 6px; padding: 3px 8px;
    color: var(--ag-hue); background: var(--ag-tint);
    max-width: 100%; display: inline-flex; align-items: center; gap: 6px;
  }
  #ag2ui5-tags-preview .ag-tag-label { max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #ag2ui5-tags-preview .ag-tag[data-color="teal"] { --ag-hue: light-dark(#006b67, #85d6cd); --ag-tint: light-dark(#e3f5f1, #183d3a); }
  #ag2ui5-tags-preview .ag-tag[data-color="purple"] { --ag-hue: light-dark(#6941a5, #d1b2ff); --ag-tint: light-dark(#f1eafa, #35264b); }
  #ag2ui5-tags-preview .ag-tag[data-color="rose"] { --ag-hue: light-dark(#9d3568, #f3a8ce); --ag-tint: light-dark(#fcebf3, #49273a); }
  #ag2ui5-tags-preview .ag-tag[data-color="amber"] { --ag-hue: light-dark(#865600, #f3ce87); --ag-tint: light-dark(#fff2d9, #47391d); }
  #ag2ui5-tags-preview .ag-tag[data-color="slate"] { --ag-hue: light-dark(#435a73, #b4c8dc); --ag-tint: light-dark(#edf1f6, #2e3d4d); }
  #ag2ui5-tags-preview .ag-more {
    font: inherit; font-size: 12px; border: 1px solid var(--ag-line);
    color: var(--ag-muted); background: var(--ag-surface); border-radius: 6px; padding: 2px 7px;
  }
  #ag2ui5-tags-preview [data-treatment="dots"] .ag-tag { background: transparent; color: var(--ag-text); padding: 2px 2px; border-radius: 0; }
  #ag2ui5-tags-preview [data-treatment="dots"] .ag-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ag-hue); flex-shrink: 0; }
  #ag2ui5-tags-preview [data-treatment="dots"] .ag-tags { gap: 6px 12px; }
  #ag2ui5-tags-preview .ag-link { color: var(--ag-link); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; margin: 7px 0; }
  #ag2ui5-tags-preview .ag-meta { color: var(--ag-muted); font-size: 13px; margin: 5px 0; }
  #ag2ui5-tags-preview .ag-meta span { color: var(--ag-link); }
  #ag2ui5-tags-preview .ag-actions { display: flex; align-items: center; gap: 14px; color: var(--ag-link); padding-top: 12px; }
  #ag2ui5-tags-preview .ag-table { background: var(--ag-surface); margin: 18px; }
  #ag2ui5-tags-preview .ag-row { display: grid; grid-template-columns: 25px minmax(180px, 1.6fr) minmax(110px, .85fr) minmax(100px, 1fr) 70px 90px 30px; gap: 10px; align-items: center; padding: 14px; border-bottom: 1px solid var(--ag-line); }
  #ag2ui5-tags-preview .ag-row > * { min-width: 0; }
  #ag2ui5-tags-preview .ag-column-head { color: var(--ag-muted); font-size: 12px; background: var(--ag-bg); }
  #ag2ui5-tags-preview .ag-row .ag-tags { margin-top: 6px; }
  #ag2ui5-tags-preview .ag-row .ag-name { font-size: 14px; }
  #ag2ui5-tags-preview .ag-mobile-details { display: none; }
  #ag2ui5-tags-preview .ag-empty { min-height: 70px; }
  #ag2ui5-tags-preview [hidden] { display: none !important; }
  @media (max-width: 800px) {
    #ag2ui5-tags-preview .ag-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #ag2ui5-tags-preview .ag-row { grid-template-columns: 24px minmax(0, 1fr) 30px; }
    #ag2ui5-tags-preview .ag-desktop { display: none; }
    #ag2ui5-tags-preview .ag-mobile-details { display: block; }
  }
  @media (max-width: 500px) {
    #ag2ui5-tags-preview .ag-grid { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 12px; }
    #ag2ui5-tags-preview .ag-top { flex-wrap: wrap; padding: 12px; }
    #ag2ui5-tags-preview .ag-table { margin: 12px; }
    #ag2ui5-tags-preview .ag-preview { min-height: 820px; }
    #ag2ui5-tags-preview .ag-preview[data-layout="list"] { min-height: 440px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('ag2ui5-tags-preview');
  const repos = [
    { name: 'abapGit', package: '$ABAPGIT', url: 'github.com/abapGit/abapGit', branch: 'main', pull: 'Today', favorite: true, labels: ['core', 'tools', 'production'] },
    { name: 'abap2UI5', package: '$ABAP2UI5', url: 'github.com/abap2UI5/abap2UI5', branch: 'main', pull: 'Yesterday', favorite: true, labels: ['core', 'ui5', 'tools', 'experimental', 'transportable', 'long-project-classification'] },
    { name: 'Offline utilities', package: '$LOCAL_UTILITIES', url: '', branch: '', pull: 'Oct 6', favorite: false, labels: [] }
  ];
  const colors = { core: 'blue', tools: 'teal', production: 'purple', ui5: 'rose', experimental: 'amber', transportable: 'slate', 'long-project-classification': 'blue' };
  let layout = window.openai?.widgetState?.modelContent?.layout === 'list' ? 'list' : 'tiles';
  const settings = { visibleLabels: 3 };
  const el = (tag, cls, text) => { const node = document.createElement(tag); if (cls) node.className = cls; if (text !== undefined) node.textContent = text; return node; };
  function icon(name, cls) { const node = el('i', cls); node.setAttribute('data-lucide', name); node.setAttribute('aria-hidden', 'true'); return node; }
  function labels(repo) {
    const wrap = el('div', 'ag-tags');
    wrap.setAttribute('aria-label', 'Repository labels');
    const limit = settings.visibleLabels;
    repo.labels.forEach((label, index) => {
      const chip = el('span', 'ag-tag'); chip.dataset.color = colors[label];
      const text = el('span', 'ag-tag-label', label); text.setAttribute('data-tooltip', label);
      chip.append(text); chip.hidden = index >= limit; wrap.append(chip);
    });
    if (repo.labels.length > limit) {
      const more = el('button', 'ag-more cursor-interaction', '+' + (repo.labels.length - limit));
      more.type = 'button'; more.setAttribute('aria-label', 'Show all labels for ' + repo.name); more.setAttribute('aria-expanded', 'false');
      more.onclick = () => {
        const expanded = more.getAttribute('aria-expanded') !== 'true';
        wrap.querySelectorAll('.ag-tag').forEach((chip, index) => chip.hidden = !expanded && index >= limit);
        more.setAttribute('aria-expanded', String(expanded));
        more.textContent = expanded ? 'Less' : '+' + (repo.labels.length - limit);
      };
      wrap.append(more);
    }
    return wrap;
  }
  function render() {
    root.querySelectorAll('.ag-preview').forEach(surface => {
      surface.replaceChildren();
      surface.dataset.layout = layout;
      const top = el('div', 'ag-top'); top.append(el('h2', 'ag-title', 'abapGit – Repositories'));
      const toggle = el('div', 'ag-layout'); toggle.setAttribute('aria-label', 'Overview layout');
      ['tiles', 'list'].forEach(mode => {
        const button = el('button', 'cursor-interaction', mode === 'tiles' ? 'Tiles' : 'List'); button.type = 'button'; button.setAttribute('aria-pressed', String(layout === mode));
        button.onclick = () => { layout = mode; render(); window.openai?.setWidgetState?.({ modelContent: { layout }, privateContent: {} }).catch(() => {}); };
        toggle.append(button);
      });
      top.append(toggle); surface.append(top);
      if (layout === 'tiles') {
        const grid = el('div', 'ag-grid');
        repos.forEach(repo => {
          const tile = el('article', 'ag-tile'); const header = el('div', 'ag-tile-header');
          header.append(icon(repo.url ? 'cloud' : 'unplug', 'ag-repo-icon'));
          const identity = el('div', 'ag-identity'); identity.append(el('div', 'ag-name', repo.name), el('div', 'ag-package', repo.package));
          header.append(identity, icon(repo.favorite ? 'star' : 'star', 'ag-star')); tile.append(header);
          const content = el('div', 'ag-tile-content');
          if (repo.labels.length) content.append(labels(repo));
          if (repo.url) { const link = el('div', 'ag-link', repo.url); link.setAttribute('data-tooltip', repo.url); content.append(link); }
          if (repo.branch) { const branch = el('div', 'ag-meta', 'Branch: '); branch.append(el('span', '', repo.branch)); content.append(branch); }
          content.append(el('div', 'ag-meta', 'Last pull: ' + repo.pull));
          const actions = el('div', 'ag-actions'); actions.append(icon('trash-2'), icon('package-minus')); content.append(actions);
          tile.append(content); grid.append(tile);
        }); surface.append(grid);
      } else {
        const table = el('div', 'ag-table'); table.setAttribute('role', 'table'); table.setAttribute('aria-label', 'Repositories');
        const headings = el('div', 'ag-row ag-column-head'); headings.setAttribute('role', 'row');
        ['☆', 'Name', 'Package', 'URL', 'Branch', 'Last pull', ''].forEach((name, index) => { const cell = el('div', index > 1 && index < 6 ? 'ag-desktop' : '', name); cell.setAttribute('role', 'columnheader'); headings.append(cell); }); table.append(headings);
        repos.forEach(repo => {
          const row = el('div', 'ag-row'); row.setAttribute('role', 'row'); const star = el('div', 'ag-star', repo.favorite ? '★' : '☆'); star.setAttribute('role', 'cell'); row.append(star);
          const identity = el('div', 'ag-identity'); identity.setAttribute('role', 'cell'); identity.append(el('div', 'ag-name', repo.name), el('div', 'ag-package ag-mobile-details', repo.package));
          if (repo.labels.length) identity.append(labels(repo)); row.append(identity);
          [repo.package, repo.url, repo.branch, repo.pull].forEach((value, index) => { const cell = el('div', 'ag-desktop ' + (index === 1 || index === 2 ? 'ag-link' : 'ag-meta'), value); cell.setAttribute('role', 'cell'); cell.setAttribute('data-tooltip', value); row.append(cell); });
          const action = el('div', 'ag-actions'); action.setAttribute('role', 'cell'); action.append(icon('ellipsis')); row.append(action); table.append(row);
        }); surface.append(table);
      }
    });
    if (globalThis.lucide) lucide.createIcons({ attrs: { width: 18, height: 18 } });
  }
  render();
  window.addEventListener('openai:set_globals', event => {
    const restored = event.detail?.globals?.widgetState?.modelContent?.layout;
    if (restored === 'tiles' || restored === 'list') { layout = restored; render(); }
  });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addSlider(settings, 'visibleLabels', { label: 'Visible labels', min: 2, max: 6, step: 1 });
  }
})();
</script>
